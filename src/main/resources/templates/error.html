<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Hệ Thống - FinVault Enterprise</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="bg-gradient-auth d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 text-center p-4 p-md-5">
                <div class="brand-logo-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3 mx-auto bg-danger-subtle text-danger">
                    <i class="bi bi-shield-x display-4"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Truy Cập Bị Từ Chối</h3>

                <div th:if="${param.denied != null}" class="alert alert-warning text-start small mb-4">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    Bạn không có đặc quyền RBAC để truy cập tài nguyên bảo mật này hoặc phiên làm việc đã thay đổi.
                </div>

                <div th:if="${param.denied == null}" class="alert alert-danger text-start small mb-4">
                    <i class="bi bi-x-circle-fill me-1"></i>
                    Đã xảy ra lỗi trong quá trình xử lý yêu cầu. Vui lòng thử lại hoặc liên hệ quản trị viên.
                </div>

                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2 fw-semibold">
                        <i class="bi bi-house-door-fill me-1"></i> Về Dashboard
                    </a>
                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-secondary px-3 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3 text-muted small">
                &copy; 2026 FinVault Enterprise. All rights reserved.
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
