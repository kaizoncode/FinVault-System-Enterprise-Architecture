<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - FinVault Enterprise</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="bg-gradient-auth d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-6">
            <!-- Brand Header -->
            <div class="text-center mb-4">
                <div class="brand-logo-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3">
                    <i class="bi bi-shield-check text-primary display-6"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">FinVault Enterprise</h3>
                <p class="text-muted small">Tạo tài khoản quản lý tài sản thông minh</p>
            </div>

            <!-- Register Card -->
            <div class="card shadow-lg border-0 rounded-4 auth-card">
                <div class="card-body p-4 p-md-5">
                    <h4 class="card-title fw-bold text-center mb-4">Đăng Ký Tài Khoản</h4>

                    <!-- Alert Messages -->
                    <div th:if="${errorMessage != null}" class="alert alert-danger d-flex align-items-center rounded-3 mb-3 py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
                        <span th:text="${errorMessage}">Đăng ký không thành công.</span>
                    </div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <!-- CSRF Token -->
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label for="username" class="form-label fw-semibold small text-secondary">Tên đăng nhập *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0" id="username" th:field="*{username}" placeholder="Từ 4-50 ký tự" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label fw-semibold small text-secondary">Email liên hệ *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control bg-light border-start-0" id="email" th:field="*{email}" placeholder="name@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small text-secondary">Họ và tên đầy đủ *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="fullName" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn A" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label fw-semibold small text-secondary">Số điện thoại</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="phoneNumber" th:field="*{phoneNumber}" placeholder="0901234567">
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small text-secondary">Mật khẩu * (Tối thiểu 8 ký tự)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="password" th:field="*{password}" placeholder="Nhập mật khẩu an toàn" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            <div class="form-text small text-muted">Khuyến cáo: Chứa ít nhất một chữ hoa, một chữ thường, một số và một ký tự đặc biệt.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-person-plus-fill me-1"></i> Hoàn tất đăng ký
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Đã có tài khoản?</span>
                        <a th:href="@{/login}" class="text-decoration-none fw-semibold small text-primary ms-1">Đăng nhập tại đây</a>
                    </div>
                </div>
            </div>

            <!-- Footer Note -->
            <div class="text-center mt-3 text-muted small">
                &copy; 2026 FinVault Enterprise. Mọi thông tin được mã hóa an toàn.
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
